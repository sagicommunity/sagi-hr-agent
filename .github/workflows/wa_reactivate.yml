name: HR WhatsApp reactivate old base

# Раз в неделю пишет тем, кому раньше отказали / кто не подошёл на тот момент (стадии
# «Отказ», «Резерв», «Не подходит», не свежее месяца), что вакансия открыта постоянно —
# «хантинг» части базы, а не только новых входящих откликов. Каждому максимум одно
# сообщение за всё время. Запускается через тот же секрет HH_POLL_SECRET.

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'dryrun=1 — только посчитать и показать, ничего не отправлять'
        required: false
        default: 'false'
        type: boolean

jobs:
  reactivate:
    runs-on: ubuntu-latest
    steps:
      - name: Queue reactivation messages
        env:
          HH_POLL_SECRET: ${{ secrets.HH_POLL_SECRET }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          set -e
          if [ -z "$HH_POLL_SECRET" ]; then
            echo "::error::Секрет HH_POLL_SECRET не настроен в Settings → Secrets and variables → Actions"
            exit 1
          fi
          DRY_PARAM=""
          if [ "$DRYRUN" = "true" ]; then
            DRY_PARAM="&dryrun=1"
            echo "::notice::Тестовый прогон (dryrun) — сообщения отправлены не будут"
          fi
          CACHE_BUST="$RANDOM$RANDOM"
          RESP=$(curl -s -m 55 "https://hr.sagibonus.com/api/hh_poll?secret=${HH_POLL_SECRET}&reactivate=1${DRY_PARAM}&r=${CACHE_BUST}")
          echo "$RESP"
          OK=$(echo "$RESP" | jq -r '.ok // false' 2>/dev/null || echo "false")
          if [ "$OK" != "true" ]; then
            echo "::error::wa_reactivate не вернул ok:true — см. вывод выше"
            exit 1
          fi
